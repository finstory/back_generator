<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Botón de Discord</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f0f0f0;
        margin: 0;
      }

      .discord-button {
        display: flex;
        align-items: center;
        background-color: #5865f2;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 16px;
        font-family: Arial, sans-serif;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: background-color 0.3s ease;
      }

      .discord-button .icon {
        width: 24px;
        height: 24px;
        margin-right: 10px;
      }

      .discord-button:hover {
        background-color: #4855e2;
      }
    </style>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <button class="discord-button">
      <img src="discord-icon.png" alt="Discord Icon" class="icon" />
      DISCORD
    </button>
  </body>
</html>
